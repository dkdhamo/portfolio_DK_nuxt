<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" width="1200" height="750" role="img" aria-label="Diagram: a legacy Java EE stack incrementally replaced by Spring Boot with a React front end">
  <defs>
    <linearGradient id="mgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#181818"/>
      <stop offset="100%" stop-color="#101010"/>
    </linearGradient>
    <pattern id="mgGrid" width="50" height="50" patternUnits="userSpaceOnUse">
      <path d="M50 0H0V50" fill="none" stroke="#ffffff" stroke-opacity="0.04" stroke-width="1"/>
    </pattern>
  </defs>

  <rect width="1200" height="750" fill="url(#mgBg)"/>
  <rect width="1200" height="750" fill="url(#mgGrid)"/>
  <rect x="0" y="0" width="6" height="750" fill="#fa5b0f"/>

  <!-- before -->
  <g transform="translate(120, 255)">
    <text x="0" y="0" font-family="Open Sans, Segoe UI, sans-serif" font-size="14" letter-spacing="3" fill="#777">BEFORE</text>
    <rect x="0" y="22" width="380" height="204" rx="10" fill="#1c1c1c" stroke="#333" stroke-width="1.5"/>
    <text x="28" y="70" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#9a9a9a">JSP views</text>
    <text x="28" y="110" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#9a9a9a">Servlets + JSTL</text>
    <text x="28" y="150" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#9a9a9a">Raw JDBC</text>
    <text x="28" y="190" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#9a9a9a">Server-rendered pages</text>
  </g>

  <!-- incremental cutover -->
  <g transform="translate(520, 364)">
    <path d="M0 15 H120" stroke="#fa5b0f" stroke-width="3"/>
    <path d="M110 4 L124 15 L110 26 Z" fill="#fa5b0f"/>
    <text x="62" y="-14" font-family="Open Sans, Segoe UI, sans-serif" font-size="13" letter-spacing="2" fill="#fa5b0f" text-anchor="middle">INCREMENTAL</text>
  </g>

  <!-- after -->
  <g transform="translate(700, 255)">
    <text x="0" y="0" font-family="Open Sans, Segoe UI, sans-serif" font-size="14" letter-spacing="3" fill="#fa5b0f">AFTER</text>
    <rect x="0" y="22" width="380" height="204" rx="10" fill="#241407" stroke="#fa5b0f" stroke-width="2"/>
    <text x="28" y="70" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#e8d5c6">React + TypeScript</text>
    <text x="28" y="110" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#e8d5c6">Spring Boot / Spring MVC</text>
    <text x="28" y="150" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#e8d5c6">Spring Data JPA + Hibernate</text>
    <text x="28" y="190" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#e8d5c6">REST / JAX-RS endpoints</text>
  </g>

  <text x="600" y="565" font-family="Open Sans, Segoe UI, sans-serif" font-size="18" fill="#8a8a8a" text-anchor="middle">Spring Security &#183; SQL Server &#183; Docker &#183; CI/CD</text>
</svg>
